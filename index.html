<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#91b69e"><meta name="description" content="Ο ψηφιακός κατάλογος του Azucar Coffee στον Κορυδαλλό.">
<title>Azucar Coffee | Κατάλογος</title>
<style>
:root{--green:#91b69e;--deep:#355844;--cream:#f6f4e9;--gold:#c7a65b;--ink:#26352b;--muted:#758078}*{box-sizing:border-box}body{margin:0;background:#edf0e8;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 35px #1c332015}.hero{background:linear-gradient(145deg,#a8c5ad,#789e85);padding:30px 22px 25px;text-align:center;color:white;border-radius:0 0 28px 28px}.logo{display:block;width:164px;height:164px;max-width:52vw;max-height:52vw;object-fit:contain;border-radius:50%;border:4px solid #e8d49a;box-shadow:0 8px 24px #263d2b35;margin:0 auto 8px}.brand,.sub{display:none}.tag{font-size:13px;margin-top:12px;color:#f8f5e9}.intro{padding:23px 20px 8px}.intro h1{font-size:24px;margin:0 0 5px;color:var(--deep)}.intro p{margin:0;color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 17px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #d7dfd4;background:#fff;color:var(--deep);border-radius:999px;padding:10px 15px;font-weight:650;font-size:13px}.tabs button.active{background:var(--deep);color:white;border-color:var(--deep)}.section{padding:0 18px 22px}.section h2{font-size:19px;color:var(--deep);padding:10px 2px;border-bottom:1px solid #d9dfd5;margin:0 0 4px}.item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 3px;border-bottom:1px solid #e6e9e1}.item h3{font-size:15px;margin:0 0 4px;font-weight:700}.item p{font-size:12px;color:var(--muted);margin:0}.price{white-space:nowrap;color:var(--deep);font-size:14px;font-weight:750}.note{font-size:11px;color:var(--muted);padding:0 20px 22px}.footer{text-align:center;background:#e7ecdf;padding:22px;color:var(--deep);font-size:12px}.footer strong{display:block;font-family:Georgia,serif;font-size:22px;margin-bottom:3px}.hidden{display:none}@media(min-width:600px){.hero{padding-top:38px}.section{padding-left:28px;padding-right:28px}.intro{padding-left:30px}}
</style></head><body><main class="wrap">
<header class="hero"><img class="logo" src="assets/azucar-logo.png" alt="Azúcar Coffee Bar – Breakfast & more"><div class="tag">Ο κατάλογός μας · Κορυδαλλός</div></header>
<div class="intro"><h1>Καλώς ήρθες!</h1><p>Διάλεξε την κατηγορία σου και ανακάλυψε τις επιλογές μας.</p></div>
<nav class="tabs" id="tabs" aria-label="Κατηγορίες"></nav><div id="menu"></div>
<p class="note">Οι τιμές εμφανίζονται όπως καταγράφηκαν στον κατάλογο της επιχείρησης. Για τυχόν αλλαγές, ισχύει η ενημέρωση του καταστήματος.</p>
<footer class="footer"><strong>Azúcar Coffee</strong>Σας ευχαριστούμε για την προτίμησή σας! ☕</footer>
</main><script>
const groups=[
{name:'Καφέδες',items:[['Freddo Espresso','2,40€ / 2,50€'],['Freddo Espresso Large','2,90€'],['Freddo Espresso Extra Large','3,50€'],['Freddo Cappuccino','2,60€'],['Cappuccino διπλό','2,60€'],['Cappuccino Large','3,00€'],['Cappuccino Extra Large','3,70€'],['Ελληνικός','2,00€'],['Ελληνικός μονός','1,60€'],['Frappe','2,00€'],['Nes καφέ','2,00€'],['Espresso μονό','1,70€'],['Espresso διπλό','2,00€'],['Latte','2,20€'],['Αμερικάνικο','1,70€'],['Cappuccino μονό','2,40€'],['Επιπλέον διπλή / κρέμα','0,30€']]},
{name:'Τυρόπιτες & Σφολιάτες',items:[['Μπουγάτσα μήλο','2,50€'],['Πεϊνιρλί μεγάλο','2,20€'],['Τυρόπιτα χωριάτικη','2,00€'],['Τυρόπιτα κουρού','2,00€'],['Τυρόπιτα χωριάτικη (με κασεροκροκέτες)','2,40€'],['Γαλοπιτάκια','2,50€'],['Πίτσα πεπερόνι','2,50€'],['Πίτσα απλή','2,40€'],['Πίτσα πεπερόνι (εναλλακτική εγγραφή)','2,50€'],['Ζαμπονοτυρόπιτα','2,20€'],['Λουκανόπιτα','2,30€'],['Πατατόπιτα','2,20€'],['Μπουρεκάκια','3,00€'],['Σπανακόπιτα','2,50€'],['Ζαμπονοτυρόπιτα με φρέσκο ντομάτα','2,50€'],['Κρουασάν με διπλή σοκολάτα','2,50€'],['Κρουασάν βουτύρου','2,00€'],['Πενιρλί','2,80€'],['Κρουασάν ταχίνι-τυρί','2,40€'],['Κρουασάν σοκολάτας','2,20€']]},
{name:'Ροφήματα & Χυμοί',items:[['Γρανίτα','2,50€'],['Φυσικός χυμός','2,50€'],['Smoothies','3,50€'],['Τσάι','1,50€'],['Σοκολάτα','2,50€'],['Ελληνικοί χυμοί','3,00€'],['Freddoccino','2,50€']]},
{name:'Γλυκές σοκολάτες',items:[['Classic','2,50€'],['Choco Biscotto','2,50€'],['Choco Bueno','2,50€'],['Choco Sale Caramello','2,50€'],['Lorit Nutella Cream','2,90€'],['Red Velvet','2,60€'],['Bueno','2,90€'],['Λευκή σοκολάτα','2,00€']]},
{name:'Αναψυκτικά & Νερά',items:[['Coca-Cola (Original, Light, Zero) · 330ml','1,40€'],['Fanta (Λεμονίτα, Πορτοκάλι) · 330ml','1,40€'],['Sprite · 330ml','1,40€'],['Λουξ (Λεμονάδα, Πορτοκάλι, Βυσσινάδα)','2,00€'],['Lipton Lemon Peach','1,80€'],['Lipton Lemon Zero Sugar','2,00€'],['Milko · 500ml','2,00€'],['Αύρα Free ανθρακούχο','1,50€'],['Αύρα (πορτοκάλι / μήλο / λεμόνι)','1,50€'],['Motion','1,50€'],['Νερό','0,50€']]},
{name:'Ενεργειακά & Ποτά',items:[['Red Bull','1,90€'],['Hell (Strawberry Melon, Red Grape, Apple, Black Cherry)','1,20€'],['Monster (Ultra Paradise, Mango Loco, Original, Mixxd Berry, Pipeline Punch, Rio Punch, Absolute Zero, Ultra Watermelon, Land of M... κ.ά.)','2,00€']]},
{name:'Σιρόπια',items:[['Bubble Gum · Strawberry · Vanilla · Caramel · Hazelnut · Pumpkin Spice · Chestnut','Επιλογές γεύσεων']]}
];
const tabs=document.getElementById('tabs'),menu=document.getElementById('menu');let active=0;
function render(){tabs.innerHTML='';groups.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g.name;b.className=i===active?'active':'';b.onclick=()=>{active=i;render()};tabs.appendChild(b)});const g=groups[active];menu.innerHTML=`<section class="section"><h2>${g.name}</h2>${g.items.map(([n,p])=>`<article class="item"><div><h3>${n}</h3></div><div class="price">${p}</div></article>`).join('')}</section>`}render();
</script></body></html>
